# Render Blueprint: one web service that builds the frontend and serves it from FastAPI.
services:
  - type: web
    name: patient-data-generator
    runtime: python
    plan: free
    buildCommand: >-
      cd frontend && npm ci && npm run build &&
      cd ../backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: NODE_VERSION
        value: "22"
      # Secrets: Render asks for these when the Blueprint is created.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: GENERATION_MODEL
        value: claude-opus-5
      - key: MAX_SAMPLES_PER_JOB
        value: "20"
